# AGENTX Resource Governance Rules
# SRE Engine reads this at runtime — no code changes needed to tune.
# Yaml is a suggestion, rules dict in sre.py is the source of truth.
---
resources:
  # Max bot processes allowed simultaneously
  max_bot_processes: 8
  # Max cron scripts (no_agent mode)
  max_cron_scripts: 15
  # Free RAM alert threshold (MB)
  memory_free_mb_min: 500
  # Free disk alert threshold (MB)
  disk_free_mb_min: 1000

mt5:
  # Max simultaneous MT5 connections (prevents IPC congestion)
  max_simultaneous_connect: 5
  # Seconds between full IPC restarts
  ipc_restart_cooldown: 30

services:
  backend_port: 8005
  bridge_port: 5000

circuit_breaker:
  # Consecutive SRE failures before self-pause
  failures_before_pause: 3
  # How long to pause (seconds)
  pause_duration_sec: 600

logging:
  max_log_size_mb: 50
  max_log_age_days: 7
