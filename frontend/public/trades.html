<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trades — Agent X</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#050508;--card:#0d0d1a;--text:#e2e8f0;--text-sec:#94a3b8;--border:#1e1e2e;--accent:#00d4aa;--danger:#ef4444;--success:#22c55e;--sidebar-w:240px;--radius:12px; }
    .light { --bg:#f5f5f7;--card:#ffffff;--text:#1a1a2e;--text-sec:#64748b;--border:#e2e8f0; }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background 0.3s,color 0.3s;}
    ::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
    .sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--card);border-right:1px solid var(--border);padding:20px 0;display:flex;flex-direction:column;z-index:100;transition:transform 0.3s,background 0.3s;}
    .sidebar-brand{padding:0 20px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
    .sidebar-brand svg{width:32px;height:32px;flex-shrink:0;}
    .sidebar-brand span{font-size:16px;font-weight:700;color:var(--accent);}
    .sidebar-nav{flex:1;padding:12px 0;overflow-y:auto;}
    .nav-item{display:flex;align-items:center;gap:12px;padding:10px 20px;color:var(--text-sec);text-decoration:none;font-size:14px;font-weight:500;border-left:3px solid transparent;}
    .nav-item:hover,.nav-item.active{color:var(--text);background:rgba(0,212,170,0.06);}
    .nav-item.active{border-left-color:var(--accent);color:var(--accent);}
    .nav-item .icon{font-size:18px;width:22px;text-align:center;}
    .sidebar-footer{padding:12px 20px;border-top:1px solid var(--border);}
    .theme-toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg);border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-sec);margin-bottom:8px;border:none;width:100%;font-family:'Inter',sans-serif;}
    .theme-toggle:hover{background:var(--border);}
    .logout-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;background:none;border:1px solid var(--border);border-radius:8px;color:var(--danger);font-size:13px;cursor:pointer;width:100%;font-family:'Inter',sans-serif;}
    .logout-btn:hover{background:rgba(239,68,68,0.1);}
    .main-content{margin-left:var(--sidebar-w);padding:24px 32px;min-height:100vh;}
    .page-header{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
    .page-header h1{font-size:26px;font-weight:700;}
    .hamburger{display:none;background:none;border:none;color:var(--text);font-size:24px;cursor:pointer;padding:4px;z-index:101;}
    .overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;overflow-x:auto;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th{text-align:left;padding:10px 8px;border-bottom:2px solid var(--border);color:var(--text-sec);font-size:12px;text-transform:uppercase;letter-spacing:0.3px;}
    td{padding:10px 8px;border-bottom:1px solid var(--border);}
    tr:hover{background:rgba(0,212,170,0.03);}
    .trade-profit{color:var(--success);font-weight:600;}
    .trade-loss{color:var(--danger);font-weight:600;}
    .loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text-sec);}
    .loading::after{content:'';width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-left:8px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    @media(max-width:768px){
      .sidebar{transform:translateX(-100%);}.sidebar.open{transform:translateX(0);}.overlay.show{display:block;}
      .main-content{margin-left:0;padding:16px;}.hamburger{display:block;}
      table{font-size:12px;}th,td{padding:6px 4px;}
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><svg viewBox="0 0 48 48" fill="none"><rect x="4" y="14" width="8" height="20" rx="2" fill="currentColor" opacity="0.6"/><rect x="16" y="8" width="8" height="26" rx="2" fill="currentColor" opacity="0.8"/><rect x="28" y="18" width="8" height="16" rx="2" fill="currentColor"/><rect x="40" y="4" width="8" height="30" rx="2" fill="currentColor" opacity="0.4"/></svg><span>Agent X</span></div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item"><span class="icon">📊</span> Dashboard</a>
      <a href="portfolio.html" class="nav-item"><span class="icon">💼</span> Portfolio</a>
      <a href="bots.html" class="nav-item"><span class="icon">🤖</span> Bot Control</a>
      <a href="backtesting.html" class="nav-item"><span class="icon">🔙</span> Backtesting</a>
      <a href="accounts.html" class="nav-item"><span class="icon">🏦</span> Accounts</a>
      <a href="analytics.html" class="nav-item"><span class="icon">📈</span> Analytics</a>
      <a href="scripts.html" class="nav-item"><span class="icon">📝</span> Scripts</a>
      <a href="trades.html" class="nav-item active"><span class="icon">🔄</span> Trades</a>
      <a href="decision-log.html" class="nav-item"><span class="icon">📋</span> Decisions</a>
      <a href="ai.html" class="nav-item"><span class="icon">🧠</span> AI Agents</a>
      <a href="settings.html" class="nav-item"><span class="icon">⚙️</span> Settings</a>
    </nav>
    <div class="sidebar-footer">
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
      <button class="logout-btn" onclick="logout()">🚪 Sign Out</button>
    </div>
  </aside>
  <main class="main-content">
    <div class="page-header">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <h1>Trade History</h1>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <select id="filterMagic" style="padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;">
          <option value="">All Bots</option>
        </select>
        <select id="filterSymbol" style="padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;">
          <option value="">All Symbols</option>
        </select>
        <select id="filterOutcome" style="padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;">
          <option value="">All Results</option>
          <option value="win">Wins Only</option>
          <option value="loss">Losses Only</option>
        </select>
        <select id="filterDays" style="padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;">
          <option value="7">7 Days</option>
          <option value="14">14 Days</option>
          <option value="30" selected>30 Days</option>
          <option value="90">90 Days</option>
        </select>
        <span id="activeAccount" style="margin-left:auto;font-size:12px;color:var(--text-sec);padding:4px 10px;background:var(--card);border-radius:6px;"></span>
      </div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>#</th><th>Pair</th><th>Direction</th><th>Volume</th><th>Profit</th><th>Open Time</th><th>Close Time</th><th>Bot</th></tr></thead>
        <tbody id="tradesBody"><tr><td colspan="8" class="loading">Loading trades...</td></tr></tbody>
      </table>
    </div>
  </main>

  <script>
    const API='';
    function authCheck(){if(!localStorage.getItem('token'))window.location.href='index.html';}
    function logout(){localStorage.removeItem('token');localStorage.removeItem('user');window.location.href='index.html';}
    function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');}
    function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
    function toggleTheme(){document.body.classList.toggle('light');const l=document.body.classList.contains('light');localStorage.setItem('theme',l?'light':'dark');document.getElementById('themeBtn').textContent=l?'☀️ Light Mode':'🌙 Dark Mode';}
    (function(){const t=localStorage.getItem('theme');if(t==='light'){document.body.classList.add('light');document.getElementById('themeBtn').textContent='☀️ Light Mode'}})();
    function fmt(n,d=2){if(n===null||n===undefined)return'--';if(typeof n==='string')n=parseFloat(n);if(isNaN(n))return'--';return(d===0?n.toFixed(0):n.toFixed(d)).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
    function fmtUsd(n){if(n===null||n===undefined)return'--';if(typeof n==='string')n=parseFloat(n);if(isNaN(n))return'--';const sign=n>=0?'':'−';return sign+'$'+fmt(Math.abs(n));}

    let activeId = null;
    let allTrades = [];
    let allBots = [];

    async function loadTrades() {
      try {
        // Fetch active account
        try {
          const actRes = await fetch(API+'/api/accounts/active', {
              headers: { 'Authorization': 'Bearer '+localStorage.getItem('token') }
          });
          const actData = await actRes.json();
          activeId = actData.active_account_id || (actData.id) || null;
        } catch(e) { activeId = null; }
        document.getElementById('activeAccount').textContent = 'Account: ' + activeId;

        // Fetch bots for filter dropdown
        try {
          const botsRes = await fetch(API+'/api/bots');
          allBots = await botsRes.json();
        } catch(e) { allBots = []; }

        // Fetch trades from /api/trades/filter
        const days = document.getElementById('filterDays').value;
        const magic = document.getElementById('filterMagic').value;
        const symbol = document.getElementById('filterSymbol').value;
        const outcome = document.getElementById('filterOutcome').value;
        let url = API+'/api/trades/filter?days='+days+'&account_id='+activeId;
        if(magic) url += '&magic='+magic;
        if(symbol) url += '&symbol='+symbol;
        if(outcome) url += '&outcome='+outcome;

        const res = await fetch(url);
        allTrades = await res.json();
        if(!Array.isArray(allTrades)) allTrades = allTrades.trades || [];
        renderTrades(allTrades);
        populateFilters(allTrades, allBots);
      } catch(e) {
        document.getElementById('tradesBody').innerHTML='<tr><td colspan="8" style="color:var(--danger);padding:20px;text-align:center;">Error loading trades: '+e.message+'</td></tr>';
      }
    }

    function renderTrades(trades) {
      const body = document.getElementById('tradesBody');
      if(!trades || trades.length===0) {
        body.innerHTML='<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-sec)">No trades found for this period</td></tr>';
        return;
      }
      body.innerHTML = trades.map((t,i) => {
        const sym = t.pair || t.symbol || '?';
        const dir = t.direction || t.type || 'N/A';
        const vol = t.volume || 0;
        const profit = t.profit || t.net_profit || 0;
        const openTime = t.open_time || t.entry_time || 'N/A';
        const closeTime = t.close_time || t.exit_time || 'N/A';
        const botName = t.comment || t.bot_name || t.magic || 'N/A';
        const isWin = profit > 0;
        return `
          <tr>
            <td style="color:var(--text-sec);font-size:11px;">${i+1}</td>
            <td><strong>${sym}</strong></td>
            <td><span style="padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;${dir.toUpperCase()==='BUY'?'background:rgba(34,197,94,0.15);color:var(--success)':'background:rgba(239,68,68,0.15);color:var(--danger)'}">${dir.toUpperCase()}</span></td>
            <td>${typeof vol==='number'?vol.toFixed(2):vol}</td>
            <td class="${isWin?'trade-profit':'trade-loss'}">${isWin?'+':''}$${Math.abs(profit).toFixed(2)}</td>
            <td style="color:var(--text-sec);font-size:12px;">${openTime}</td>
            <td style="color:var(--text-sec);font-size:12px;">${closeTime}</td>
            <td style="font-size:12px;">${botName}</td>
          </tr>
        `;
      }).join('');
    }

    function populateFilters(trades, bots) {
      // Magic/bot filter
      const magSel = document.getElementById('filterMagic');
      const currentMag = magSel.value;
      magSel.innerHTML = '<option value="">All Bots</option>';
      (bots||[]).forEach(b => {
        const name = b.name || '';
        magSel.innerHTML += '<option value="'+(b.config?.magic||'')+'">'+name+'</option>';
      });
      if(currentMag) magSel.value = currentMag;

      // Symbol filter
      const symSel = document.getElementById('filterSymbol');
      const currentSym = symSel.value;
      const symbols = new Set();
      (trades||[]).forEach(t => {
        const s = t.pair || t.symbol || '';
        if(s) symbols.add(s);
      });
      symSel.innerHTML = '<option value="">All Symbols</option>';
      [...symbols].sort().forEach(s => {
        symSel.innerHTML += '<option value="'+s+'">'+s+'</option>';
      });
      if(currentSym) symSel.value = currentSym;
    }

    // Filter change handlers
    document.getElementById('filterMagic').addEventListener('change', loadTrades);
    document.getElementById('filterSymbol').addEventListener('change', loadTrades);
    document.getElementById('filterOutcome').addEventListener('change', loadTrades);
    document.getElementById('filterDays').addEventListener('change', loadTrades);

    authCheck(); loadTrades();
  </script>
</body>
</html>
